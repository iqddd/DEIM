__include__: [
  './deim_hgnetv2_x_train_dataset_tuning_768.yml'
]

output_dir: ./deim_outputs/deim_hgnetv2_x_train_dataset_tuning_768_freeze_stage1

HGNetv2:
  freeze_stem_only: False
  freeze_at: 1
  freeze_norm: True

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.000001
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn)).*$'
      weight_decay: 0.

  lr: 0.0001
  betas: [0.9, 0.999]
  weight_decay: 0.000125

warmup_iter: 100
